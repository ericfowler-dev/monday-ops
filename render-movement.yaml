services:
  - type: cron
    name: weekly-movement-report
    runtime: node
    plan: starter
    # Render cron uses UTC. Running at both possible UTC hours lets the script
    # enforce Monday 5:00 AM America/Chicago across daylight-saving changes.
    schedule: '0 10,11 * * 1'
    buildCommand: npm ci
    startCommand: node generate-weekly-movement-report.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONDAY_API_TOKEN
        sync: false
      - key: MOVEMENT_REPORT_TO_EMAIL
        value: efowler@psiengines.com
      - key: M365_TENANT_ID
        sync: false
      - key: M365_CLIENT_ID
        sync: false
      - key: M365_CLIENT_SECRET
        sync: false
      - key: M365_SENDER_UPN
        sync: false
      - key: REDIS_URL
        sync: false
